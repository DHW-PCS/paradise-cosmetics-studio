services:
  db:
    image: mariadb:10.11@sha256:0d0945c57f75b3a3b9ebe71aedaaad005fa5305054e8fca3d2e42a8c92b43b5e
    env_file: db.env
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --default-time-zone=+00:00]
    ports:
      - target: 3306
        host_ip: 127.0.0.1
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 3s
      retries: 40
    volumes:
      - data:/var/lib/mysql
volumes:
  data:
